spring.application.name=ecommerce_product

#Configuração de conexão com PostgresSQL
spring.datasource.url=jdbc:postgresql://localhost:5436/ecommerce_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.drive-class-name=org.postgresql.Driver

#Geração e atualização automatica das tabelas via hibernate
spring.jpa.hibernate.ddl-auto=update

#Dialeto e Formatação de Logs SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.format_sql=true
